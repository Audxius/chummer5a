name: Parity Baseline

# Captures golden-master output from the original .NET Framework 4.8 engine (Windows only),
# then re-runs the parity suite against it in a fresh process to surface nondeterministic output
# that the normalizer still needs to handle. Download the "parity-golden" artifact and commit it
# to Chummer.Parity/Golden once the determinism check is clean.
#
# The engine is always the `parity-baseline` tag (the last commit before the port started changing
# engine code). The parity harness itself (Chummer.Tests/Parity) is taken from the triggering commit
# and overlaid, so the harness can evolve without moving the reference engine.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Engine commit/tag to capture from'
        default: 'parity-baseline'
  push:
    branches: [ native ]
    paths:
      - '.github/workflows/parity-baseline.yml'
      - 'Chummer.Tests/Parity/**'

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
        working-directory: ref

    steps:
    - name: Checkout reference engine
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.ref || 'parity-baseline' }}
        path: ref

    - name: Checkout current harness
      uses: actions/checkout@v4
      with:
        path: harness

    - name: Overlay current parity harness onto the reference engine
      run: |
        if (Test-Path Chummer.Tests/Parity) { Remove-Item Chummer.Tests/Parity -Recurse -Force }
        Copy-Item ../harness/Chummer.Tests/Parity Chummer.Tests/Parity -Recurse
        Get-ChildItem Chummer.Tests/Parity

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('ref/**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Setup MSBuild (full framework, same toolchain as the official AppVeyor builds)
      uses: microsoft/setup-msbuild@v2

    - name: Build tests
      run: |
        # Forward slashes: a trailing backslash before a closing quote would escape the quote on Windows.
        $solutionDir = "$env:GITHUB_WORKSPACE/ref/" -replace '\\', '/'
        msbuild Chummer.Tests/Chummer.Tests.csproj -restore -m -verbosity:minimal -p:Configuration=Release "-p:SolutionDir=$solutionDir" 2>&1 | Tee-Object -FilePath build.log
        $code = $LASTEXITCODE
        # Surface errors as annotations, since job logs need authentication to read.
        Select-String -Path build.log -Pattern ': error |error MSB|error NU|error CS' | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line)" }
        exit $code

    - name: Capture golden output (net48 reference engine)
      env:
        CHUMMER_PARITY_MODE: capture
        CHUMMER_PARITY_GOLDEN_DIR: ${{ github.workspace }}\parity\Golden
      run: |
        dotnet test Chummer.Tests/Chummer.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Chummer.Tests.Parity" --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath capture.log
        $code = $LASTEXITCODE
        Select-String -Path capture.log -Pattern 'Failed |Passed |Error Message|mismatch|Exception:' | Select-Object -First 40 | ForEach-Object { Write-Output "::warning::$($_.Line)" }
        exit $code

    - name: Determinism check (verify against the capture in a fresh process)
      id: determinism
      continue-on-error: true
      env:
        CHUMMER_PARITY_MODE: verify
        CHUMMER_PARITY_GOLDEN_DIR: ${{ github.workspace }}\parity\Golden
      run: |
        dotnet test Chummer.Tests/Chummer.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Chummer.Tests.Parity" --logger "console;verbosity=normal" 2>&1 | Tee-Object -FilePath determinism.log
        $code = $LASTEXITCODE
        Select-String -Path determinism.log -Pattern 'differs at line|no golden|not well-formed|Failed |Passed ' | Select-Object -First 60 | ForEach-Object { Write-Output "::warning::$($_.Line)" }
        exit $code

    - name: Upload golden output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: parity-golden
        path: parity/Golden
        if-no-files-found: ignore

    - name: Upload nondeterministic output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: parity-nondeterministic
        path: parity/Actual
        if-no-files-found: ignore

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: parity-logs
        path: ref/*.log
        if-no-files-found: ignore

    # Preserve artifacts above, then make a failed comparison visible in the job result.
    - name: Fail when determinism verification failed
      if: always() && steps.determinism.outcome == 'failure'
      run: exit 1
